<title>TITANOVA Slots</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
    text-align:center;
}

.header{
    padding:30px 15px;
    background:linear-gradient(135deg,#111,#2b2100);
    border-bottom:1px solid #5b4700;
}

.logo{
    font-size:40px;
    font-weight:bold;
    color:#ffd700;
    margin-bottom:8px;
}

.subtitle{
    font-size:20px;
    color:#ddd;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.slot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#151515;
    border:1px solid #444;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 0 12px rgba(255,215,0,0.08);
}

.slot-name{
    font-size:24px;
    font-weight:bold;
    text-align:left;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#ffd700;
}

.status{
    background:#168a45;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.locked{
    background:#555;
}
