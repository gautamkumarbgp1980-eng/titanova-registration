<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITANOVA Slots</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
    text-align:center;
}

.header{
    padding:25px 15px;
    background:linear-gradient(135deg,#111,#2b2100);
}

h1{
    color:#ffd700;
    margin:0;
}

p{
    color:#ddd;
}

.container{
    padding:20px;
    max-width:600px;
    margin:auto;
}

.slot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#171717;
    border:1px solid #444;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
}

.slot-name{
    font-size:18px;
    font-weight:bold;
}

.price{
    color:#ffd700;
    font-weight:bold;
}

.status{
    background:#168a45;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
}

.note{
    margin-top:25px;
    padding:15px;
    background:#151515;
    border-radius:10px;
    color:#bbb;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>⚡ TITANOVA</h1>
    <p>Slot Status</p>
</div>

<div class="container">

    <div class="slot">
        <span class="slot-name">Slot 1</span>
        <span class="price">0.001 BTCB</span>
        <span class="status">ACTIVE</span>
    </div>

    <div class="slot">
        <span class="slot-name">Slot 2</span>
        <span class="price">0.001 BTCB</span>
        <span class="status">ACTIVE</span>
    </div>

    <div class="slot">
        <span class="slot-name">Slot 3</span>
        <span class="price">0.001 BTCB</span>
        <span class="status">ACTIVE</span>
